# Render 部署設定（Blueprint）。在 Render 選「New → Blueprint」並指向這個 repo，
# 就會依照這裡的設定自動建立網站服務。
services:
  - type: web
    name: global-iron
    runtime: python
    plan: free                       # 免費方案：閒置 15 分鐘會休眠，下次開啟約等 30–60 秒
    buildCommand: pip install -r requirements.txt
    # 免費方案只有 512MB 記憶體：用 1 個 worker + 多執行緒，比多個 worker 省記憶體
    startCommand: gunicorn app:server --workers 1 --threads 4 --timeout 120
    autoDeploy: true                 # GitHub 有新的 push（包含每日資料更新）就自動重新部署
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
