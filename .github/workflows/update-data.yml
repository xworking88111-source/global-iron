# 市場資料：每個平日更新一次（價格／股價／基本面），再把快取檔 commit 回 repo。
# Render 偵測到 push 會自動重新部署。AIS 船位另見 update-ais.yml（每天 4 次）。
# EN: Market data refresh once per weekday (prices / equities / fundamentals / quarterly results /
# EN: worldsteel monthly output / China Steel prices), committed back to the repo. Render redeploys
# EN: on every push. AIS vessels are handled by update-ais.yml (4x daily).
name: update-data

on:
  schedule:
    - cron: "30 9 * * 1-5"    # 平日 UTC 09:30 = 台北 17:30，亞洲收盤後
  workflow_dispatch: {}        # 可在 GitHub 網頁上手動按「Run workflow」執行

permissions:
  contents: write

# 和 AIS 排程共用同一個群組：兩者不會同時 push，避免互相衝突
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Market data
        run: python scripts/update_data.py

      - name: Commit cache
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache
          git diff --cached --quiet && exit 0
          git commit -m "資料更新 data refresh $(date -u +%F)"
          git pull --rebase && git push
